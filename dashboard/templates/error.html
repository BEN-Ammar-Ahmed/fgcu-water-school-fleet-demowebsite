{% extends 'base.html' %}
{% block title %}{{ code }}{% endblock %}
{% block body %}
<div class="login">
  <h1>{{ 'Not allowed' if code == 403 else 'Not found' }}</h1>
  <p class="muted">{{ msg }}</p>
  <p><a class="btn ghost" href="{{ url_for('dashboard') if user else url_for('login') }}">Go back</a></p>
</div>
{% endblock %}
